name: Link Check

on:
  push:
    branches: [main, development, docker]
  pull_request:
    branches: [main, development, docker]

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v1
        with:
          config-file: .github/link-check-config.json
        continue-on-error: true  # Link checking is informational