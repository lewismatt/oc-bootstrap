---
name: Lint and Test

on:
  push:
    branches:
      - main
      - development
      - docker
  pull_request:
    branches:
      - main
      - development
      - docker

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        continue-on-error: true
        with:
          scandir: '.'
          additional_files: 'oc-bootstrap.sh scripts/install-lemonade.sh lib/helpers.sh'

      - name: shfmt
        uses: mfinelli/setup-shfmt@v3
      - run: shfmt -d -i 4 -ci oc-bootstrap.sh scripts/install-lemonade.sh

      - name: Markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v14
        with:
          config: '.markdownlint.json'
          glob: '**/*.md'

      - name: Yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: '.github/workflows/'
          config_file: .yamllint.yaml
        continue-on-error: true

  secret-detection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Secret Detection
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Docker Integration Tests
        run: |
          chmod +x tests/docker-integration-test.sh
          ./tests/docker-integration-test.sh --verbose
        timeout-minutes: 30

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            /tmp/oc-bootstrap-test-config-*.env
          retention-days: 5
