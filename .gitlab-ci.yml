---
stages:
  - lint
  - test
  - secret-detection

variables:
  SECRET_DETECTION_ENABLED: 'true'

# 1. Bash Syntax Check: Dry-run to catch broken loops or missing quotes
bash-syntax:
  stage: lint
  image: bash:latest
  script:
    - bash -n oc-bootstrap.sh

# 2. ShellCheck: Validates Bash rigor and catches bugs
shellcheck:
  stage: lint
  image: koalaman/shellcheck-alpine:stable
  script:
    - shellcheck oc-bootstrap.sh lib/helpers.sh

# 3. shfmt: Enforces strict styling and indentation
shfmt:
  stage: lint
  image: alpine:latest
  script:
    - apk add --no-cache shfmt
    # The -d flag prints a diff and fails the job if formatting is incorrect
    # The -i 4 flag enforces 4-space indentation
    # The -ci flag indents switch cases
    - shfmt -d -i 4 -ci oc-bootstrap.sh lib/helpers.sh scripts/install-lemonade.sh

# 4. MarkdownLint: Ensures prompt files are LLM-ready
markdownlint:
  stage: lint
  image: node:alpine
  script:
    - npm install -g markdownlint-cli
    - markdownlint -c .markdownlint.json .

# 5. Yamllint: Checks CI and config templates
yamllint:
  stage: lint
  image: python:alpine
  script:
    - pip install yamllint
    - yamllint -c .yamllint.yaml .gitlab-ci.yml .yamllint.yaml .markdownlint.json

# SAST and Secret Detection are included from GitLab templates
include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml