stages:
  - lint
  - test
  - secret-detection

variables:
  SECRET_DETECTION_ENABLED: 'true'

# 1. ShellCheck: Validates Bash rigor for oc-bootstrap.sh
shellcheck:
  stage: lint
  image: koalaman/shellcheck-alpine:stable
  script:
    - shellcheck oc-bootstrap.sh

# 2. MarkdownLint: Ensures prompt files are LLM-ready
markdownlint:
  stage: lint
  image: node:alpine
  script:
    - npm install -g markdownlint-cli
    - markdownlint **/*.md

# 3. Yamllint: Checks CI and config templates
yamllint:
  stage: lint
  image: python:alpine
  script:
    - pip install yamllint
    - yamllint .gitlab-ci.yml

sast:
  stage: test

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

secret_detection:
  stage: secret-detection
