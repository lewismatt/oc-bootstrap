# ==============================================================================
# OpenClaw Multi-Agent Bootstrap - Docker Compose
# ==============================================================================
# Orchestrates OpenClaw services with optional Lemonade Server for local inference
# 
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose down            # Stop all services
#   docker-compose logs -f         # View logs
# ==============================================================================

version: '3.8'

# ==============================================================================
# NETWORKS
# ==============================================================================

networks:
  openclaw-network:
    driver: bridge

# ==============================================================================
# VOLUMES (Named volumes for persistence)
# ==============================================================================

volumes:
  openclaw-data:
    driver: local

# ==============================================================================
# SERVICES
# ==============================================================================

services:

  # --------------------------------------------------------------------------
  # OpenClaw Main Service
  # --------------------------------------------------------------------------
  openclaw:
    build:
      context: .
      dockerfile: Dockerfile
    image: oc-bootstrap:latest
    container_name: oc-bootstrap
    hostname: openclaw
    restart: unless-stopped
    
    # Environment variables (load from docker-config.env or set here)
    env_file:
      - docker-config.env
    
    # Additional environment variables
    environment:
      - NODE_ENV=production
      - OPENCLAW_HOME=/home/openclaw/.openclaw
      - NON_INTERACTIVE=true
    
    # Volume mounts for persistence
    volumes:
      # Persist OpenClaw configuration, memory, and workspaces
      - openclaw-data:/home/openclaw/.openclaw
      # Optional: Mount host oc-bootstrap scripts for development
      # - ./:/home/openclaw/oc-bootstrap:ro
    
    # Network
    networks:
      - openclaw-network
    
    # Resource limits (adjust as needed)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '4'
    #       memory: 8G
    
    # Health check
    healthcheck:
      test: ["CMD", "openclaw", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # Lemonade Server (Optional - for local inference)
  # --------------------------------------------------------------------------
  # Uncomment the section below to enable local LLM inference via Lemonade Server
  # 
  # lemonade:
  #   image: python:3.11-slim
  #   container_name: lemonade-server
  #   restart: unless-stopped
  #   
  #   environment:
  #     - LEMONADE_PORT=8000
  #     - LEMONADE_HOST=0.0.0.0
  #   
  #   volumes:
  #     - ./scripts/install-lemonade.sh:/tmp/install-lemonade.sh:ro
  #     - lemonade-data:/home/lemonade
  #   
  #   ports:
  #     - "8000:8000"
  #   
  #   networks:
  #     - openclaw-network
  #   
  #   command: >
  #     bash -c "
  #       pip install lemonade-server &&
  #       lemonade-server --host 0.0.0.0 --port 8000
  #     "
  #   
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 120s

# ==============================================================================
# VOLUMES (Additional named volumes)
# ==============================================================================

# Uncomment if using Lemonade Server:
# volumes:
#   lemonade-data:
#     driver: local
