version: '3.8'

services:
  openclaw:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openclaw
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - openclaw-data:/opt/openclaw
      - openclaw-logs:/var/log/openclaw
      - ./docker-config.env:/opt/openclaw/docker-config.env
    env_file:
      - docker-config.env
    networks:
      - openclaw-network
    depends_on:
      - lemonade-server

  lemonade-server:
    image: lemonade-server:latest
    container_name: lemonade-server
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - lemonade-data:/data
    networks:
      - openclaw-network
    environment:
      - LE MONADE_MODE=server
      - LE MONADE_LOG_LEVEL=info

  redis:
    image: redis:7-alpine
    container_name: openclaw-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - openclaw-network
    command: redis-server --appendonly yes

volumes:
  openclaw-data:
  openclaw-logs:
  lemonade-data:
  redis-data:

networks:
  openclaw-network:
    driver: bridge
